// Eclipse Recoil small-group rotation: random start, then three random choices.
sv_defaultmap ""
sv_mainmaps "ennui park rooftop castle dutility trespass tomb auster mystery eternal error station bloodlust echo ubik space institute deathtrap atop venus fortitude ar_baggage cs_agency de_bank de_canals de_dust2 de_lake de_safehouse"
sv_votechoices 3
sv_rotatemaps 2
sv_rotatemapsfilter 0
sv_mapsfilter 0
sv_maphistory 1
sv_rotatemode 0
sv_rotatemuts 0

// Offer three distinct maps, excluding the current map, and keep TDM rules.
sv_mapslock 3
sv_mapslocktype 2
sv_votelock 3
sv_votelocktype 2
sv_votestyle 3 // Mid-match: floor(present humans / 2) + 1 votes for the same map.
sv_voteinterm 0 // Wait for the full ballot; plurality wins, ties are random.
sv_votethreshold 0.5
sv_timelimit 10
sv_pointlimit 0
sv_overtimeallow 0
sv_intermlimit 10000
sv_votelimit 20000

// Complete ZIP packages are served by the native HTTP server.
sv_mappackages 1
sv_mappackagedir "data/csgopen"
sv_waitforplayerload 120000
sv_waitforplayermaps 120000
sv_savevars
