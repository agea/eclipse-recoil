// Solo preferenze locali; le regole arrivano sempre dal server.
// Reapply branding after persisted client preferences have been loaded.
exec "config/csgopen/branding.cfg"
// Download and cache complete custom-map packages from the connected server.
mapautodownload 1
// Local discovery uses the dedicated LAN launcher's query port.
serverlanport 28799
searchlan 1
csgopenteamselect 1

// Optional soldier models adapted from the user's local Urban Terror install.
// The generated pack is mounted by config/defaults.cfg with the TDM package root.
csgopensoldiers 0
exec "actors/soldier/ready.cfg" 0 0

// Keep the animated lower body out of the first-person view on stairs.
// Bit 1 draws the weapon/arms; bit 2 draws the separate body model.
firstpersonmodel 1
firstpersoncamera 0

// Fast conventional shots need visible trails from their first frame.
csgopenbulletfx 1

// Preserve the chosen primary across restarts; initialize only an empty loadout.
if (= (listlen $playerloadweap) 0) [playerloadweap $W_SMG]
// Migrate the previous primary-only loadout to ordered equipment slots.
if (< (listlen $playerloadweap) 3) [playerloadweap (concat (at $playerloadweap 0) 0 $W_GRENADE $W_CORRODER $W_MINE 0)]
// Drop the previous fifth utility slot while preserving all other choices.
if (> (listlen $playerloadweap) 6) [playerloadweap (sublist $playerloadweap 0 6)]
showloadoutmenu 1
damagedivisor 1

// Indicate current primary-fire spread through the ammunition ring radius.
clipspread 1

// Select the HE independently of the primary loadout.
bind G [weapon $W_GRENADE 1]

// Select the smoke grenade independently of the HE.
bind H [weapon $W_CORRODER 1]

// No player silhouettes or damage highlights through geometry.
playerhalos 0
playerhalodamage 0

// Use scene lighting for models, without emissive strips or bloom fringes.
modelglowscale 0
modelfullbrightscale 0
fullbrightmodels 0
bloom 0
// First-run graphics initialization applies its preset after autoexec.
csgopen_client_first_run = [sleep 0 [bloom 0]]
onevent $CMD_EVENT_FIRSTRUN csgopen_client_first_run
entityhalos 0

// Hide labels above map pickups and dropped loot. Player labels are team-only.
entityitemui -1
entityprojui -1

// Select the circular proximity mine.
bind J [weapon $W_MINE 1]

// Single-shot HE grenade launcher.
bind K [weapon $W_ROCKET 1]
