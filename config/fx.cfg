defvarp fxdetail 0 2 2 reloadfx
// Local TDM presentation; original profiles keep the upstream trails.
defvar csgopenbulletfx 0 0 1 reloadfx

exec "config/fx/lib.cfg"

reloadfx = [
    fxcleardefs

    exec "config/fx/weapons/weapons.cfg"
    exec "config/fx/projs/projs.cfg"
    exec "config/fx/other/other.cfg"
]
reloadfx
