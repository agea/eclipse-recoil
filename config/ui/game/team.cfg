    #(ui_gameui_backbutton)
]

// ENet connection hides the old UI before the server sends the map and player
// snapshot. Wait for those, independently of the connection panel/loadout menu.
csgopen_team_connection_prompted = 0
csgopen_team_prompt_generation = 0

csgopen_team_reset_connection = [
    csgopen_team_prompt_generation = (+ $csgopen_team_prompt_generation 1)
    csgopen_team_connection_prompted = 0
]
onevent $CMD_EVENT_GAME_LEAVE csgopen_team_reset_connection

// 1:<connection generation>, so a pending callback cannot affect a later join.
csgopen_team_wait_ready = [
    if (&& $csgopenteamselect $isonline [= $arg1 $csgopen_team_prompt_generation]) [
        if (= (waiting 0) 0) [
            if (&& $isspectator [= $gamemode $G_DEATHMATCH] [! (hasmut $G_M_FFA)]) [
                gameui_close_all
                gameui_open ui_gameui_team
            ]
        ] [
            sleep 100 [csgopen_team_wait_ready @arg1]
        ]
    ]
]

csgopen_team_on_mapload = [
    if (&& $csgopenteamselect $isonline [! $csgopen_team_connection_prompted]) [
        csgopen_team_connection_prompted = 1
        sleep 100 [csgopen_team_wait_ready @csgopen_team_prompt_generation]
    ]
]
onevent $CMD_EVENT_MAPLOAD csgopen_team_on_mapload
