gameui_begin_ids

// Enabled only by the Eclipse Recoil TDM client preset.
defvar csgopenteamselect 0 0 1
ui_gameui_team_dims = 0.85

// 1:<team> 2:<width> 3:<height> 4:<icon size> 5:<widget id>
ui_gameui_team_button = [
    local _team_name _team_colour _icon _tip _disabled

    if (< $arg1 $T_NEUTRAL) [
        _team_colour = 0xaaaaaa
        _icon        = "textures/modes/demo"
        _tip         = "Spectate"
        _disabled    = $isspectator
    ] [
        _team_name   = (at $T_NAMES $arg1)
        _team_colour = (getteamcolour $arg1)
        _icon        = $(concatword team $_team_name tex)
        _disabled    = (&& [! $isspectator] [= $getclientteam $arg1])

        if (!= $arg1 $T_NEUTRAL) [
            _tip = (concatword "Join " (getteamname $arg1))
        ] [
            _tip = "Join game"
        ]
    ]

    ui_gameui_button [
        p_width     = $arg2
        p_height    = $arg3
        p_colour    = $_team_colour
        p_icon      = $_icon
        p_icon_size = $arg4
        p_tip       = $_tip
        p_disabled  = $_disabled
        p_id        = $arg5
        p_on_click  = [
            caseif (< @arg1 $T_NEUTRAL) [
                spectate 1
            ] (= @arg1 $T_NEUTRAL) [
                spectate 0
            ] 1 [
                team @@arg1
            ]

            gameui_close_all
        ]
    ]
]

# ui_gameui_team = [
    uivlist 0.025 [
        uistyle lefttop
        uistyle clampx

        uifill 0 0.05

        uicolour 0x55010101 0 0 [
            uistyle clampx

            ui_gameui_decortext "Pick your team" [
                p_width = $gameui_panel_new_size
            ]
            ui_gameui_shadowhoriz
        ]

        if $isonline [
            uitext (format "Server: %1:%2" $connectedip $connectedport) 1.2
        ]
        uitext "Choose a team to join, or stay in spectator mode." 1.1
        uitext "Server balancing rules apply to team requests." 1

        uifill 0 0.05

        uivlist 0.05 [
            if (hasmut $G_M_FFA) [
                uivlist 0.01 [
                    ui_gameui_team_button $T_NEUTRAL 0.4 0.2 0.15 #(gameui_get_id button)
                    uitext "Join game" 1.3
                ]
            ] [
                uihlist 0.05 [
                    uivlist 0.01 [
                        ui_gameui_team_button $T_ALPHA 0.2 0.2 0.15 #(gameui_get_id button)
                        uitext (getteamname $T_ALPHA) 1.3
                    ]
                    uivlist 0.01 [
                        ui_gameui_team_button $T_OMEGA 0.2 0.2 0.15 #(gameui_get_id button)
                        uitext (getteamname $T_OMEGA) 1.3
                    ]
                ]
